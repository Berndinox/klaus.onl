# Applied by Flux from the homelab GitOps repo (Kustomization apps-klaus-landing-site,
# target namespace klaus-landing). Only this ConfigMap lives here; deployment, route
# and nginx config stay in the GitOps repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: klaus-landing-site
    files:
      - site/index.html
      - site/404.html
      - site/robots.txt
      - og.png=site/og.png
      # The configmap flattens files; nginx serves it at /.well-known/security.txt.
      - security.txt=site/.well-known/security.txt
    options:
      # Fixed name so the deployment in the GitOps repo can reference it;
      # Reloader restarts nginx when the content changes.
      disableNameSuffixHash: true
