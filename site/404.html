<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 · klaus.onl</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e1a'/%3E%3Ctext x='6' y='23' font-family='monospace' font-size='18' fill='%238fa2ff'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Martian+Mono:wdth,wght@112.5,300;112.5,800&display=swap">
<style>
/* Same tokens as index.html; one static terminal explaining the miss. */
:root {
  color-scheme: dark;
  --bg: #0b0e1a;
  --surface: #11162a;
  --line: #222a48;
  --fg: #e4e7f3;
  --muted: #7a82a3;
  --accent: #8fa2ff;
  --ok: #5ee6a1;
  --warn: #ffb86b;
  --font-display: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f2f3f8;
    --surface: #ffffff;
    --line: #d7dbea;
    --fg: #12162a;
    --muted: #5a6182;
    --accent: #3346e0;
    --ok: #0c8f55;
    --warn: #b35c00;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 var(--font-mono);
  min-height: 100vh;
  padding-block: max(32px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.hero { container-type: inline-size; display: flex; flex-direction: column; gap: 10px; }
.status { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.status b { color: var(--warn); font-weight: 500; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.wordmark {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-stretch: 112.5%;
  font-size: min(7.5rem, calc(100cqw / (7 * 0.86)));
  line-height: 1;
  letter-spacing: -0.03em;
  white-space: nowrap;
  color: var(--warn);
}
.wordmark .tld { color: var(--accent); font-weight: 300; }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.term-bar { padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.out { margin: 0; padding: 16px; white-space: pre-wrap; word-break: break-word; font: inherit; }
.p { color: var(--accent); }
.m { color: var(--muted); }
.ok { color: var(--ok); }
.w { color: var(--warn); }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 520px) { body { font-size: 13px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="status"><span class="dot"></span><b>not found</b></div>
    <h1 class="wordmark">404<span class="tld">.onl</span></h1>
  </header>

  <section class="term" aria-label="Terminal">
    <div class="term-bar">berndinox@klaus.onl: ~</div>
<pre class="out"><span class="p">~ $</span> kubectl get page <span id="path">/somewhere</span>
<span class="w">Error from server (NotFound):</span> pages "<span id="path2">/somewhere</span>" not found

<span class="p">~ $</span> kubectl get pages
<span class="m">NAME   STATUS    AGE</span>
/      <span class="ok">Running</span>   since day one

<span class="m">there's only one page. it's a single-page cluster.</span>

<span class="p">~ $</span> <a href="/">cd ~</a></pre>
  </section>
</div>
<script>
  const p = decodeURIComponent(location.pathname).slice(0, 60);
  document.getElementById("path").textContent = p;
  document.getElementById("path2").textContent = p;
</script>
</body>
</html>
